<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embate Divino</title>
<style>
  :root{
    --bg:#0e0b13;
    --bg2:#16111f;
    --panel:#1c1626;
    --gold:#c9a15a;
    --gold-bright:#f0cf8a;
    --ink:#ece4d8;
    --ink-dim:#a99cb0;
    --danger:#a13d3d;
    --ok:#4d7a5f;
    --grego:#3b6ea5;
    --nordico:#5f7d9c;
    --egipcio:#c08a3e;
    --japones:#a3435c;
    --line:#39304a;
    --font-display:'Cinzel', 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: 'Spectral', Georgia, serif;
  }
  @font-face{
    font-family:'Cinzel';
    src:local('Cinzel');
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #1d1628 0%, #0e0b13 60%),
      var(--bg);
  }
  h1,h2,h3,.disp{font-family:var(--font-display);letter-spacing:.02em;}
  #app{max-width:1180px;margin:0 auto;padding:18px 16px 60px;}

  /* ---------- Setup screen ---------- */
  .setup{padding:40px 10px;text-align:center;}
  .setup h1{font-size:2.4rem;color:var(--gold-bright);margin-bottom:.2rem;text-shadow:0 0 30px rgba(240,207,138,.25);}
  .setup p.sub{color:var(--ink-dim);margin-top:0;font-size:1.05rem;max-width:560px;margin-inline:auto;}
  .picker-row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin:36px 0;}
  .picker{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;width:260px;}
  .picker h3{margin:0 0 12px;color:var(--gold);font-size:1.05rem;}
  .deck-opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:4px;cursor:pointer;border:1px solid transparent;margin-bottom:6px;text-align:left;}
  .deck-opt:hover{background:#251c33;}
  .deck-opt.sel{border-color:var(--gold);background:#2a2036;}
  .deck-opt.taken{opacity:.35;cursor:not-allowed;}
  .swatch{width:14px;height:14px;border-radius:50%;flex:0 0 auto;}
  .swatch.grego{background:var(--grego);} .swatch.nordico{background:var(--nordico);}
  .swatch.egipcio{background:var(--egipcio);} .swatch.japones{background:var(--japones);}

  .coach-banner{
    display:flex;gap:12px;align-items:flex-start;background:linear-gradient(180deg,#2a2036,#201931);
    border:1px solid var(--gold);border-radius:6px;padding:12px 14px;margin-bottom:10px;
  }
  .coach-banner .icon{font-size:1.3rem;line-height:1;}
  .coach-banner .txt{flex:1;font-size:.86rem;line-height:1.45;color:var(--ink);}
  .coach-banner button{flex:0 0 auto;}
  button.primary{
    font-family:var(--font-display);
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    color:#241a0c;border:none;padding:13px 34px;border-radius:4px;font-size:1.05rem;
    cursor:pointer;letter-spacing:.03em;
  }
  button.primary:disabled{opacity:.35;cursor:not-allowed;}
  button.secondary{
    font-family:var(--font-body);background:transparent;color:var(--ink);
    border:1px solid var(--line);padding:8px 16px;border-radius:4px;cursor:pointer;
  }
  button.secondary:hover{border-color:var(--gold);}

  /* ---------- Handoff screen ---------- */
  .handoff{text-align:center;padding:80px 20px;}
  .handoff h2{color:var(--gold-bright);font-size:1.8rem;}
  .handoff p{color:var(--ink-dim);}

  /* ---------- Game screen ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .topbar .title{font-size:1.15rem;color:var(--gold);}
  .phase-pill{border:1px solid var(--gold);color:var(--gold-bright);padding:4px 12px;border-radius:20px;font-size:.82rem;letter-spacing:.05em;}

  .player-strip{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;margin-bottom:8px;}
  .player-strip.opp{opacity:.85;}
  .player-strip .pname{font-family:var(--font-display);color:var(--gold-bright);}
  .stat{display:flex;gap:5px;align-items:baseline;margin-left:14px;font-size:.9rem;color:var(--ink-dim);}
  .stat b{color:var(--ink);font-size:1rem;}
  .lifebar{width:120px;height:8px;background:#2a2236;border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px;}
  .lifebar>div{height:100%;background:linear-gradient(90deg,#7c2f2f,#c96b6b);}

  .field{background:#120e1a;border:1px solid var(--line);border-radius:6px;padding:10px;min-height:150px;margin-bottom:8px;}
  .field-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-dim);margin-bottom:6px;}
  .field-row{display:flex;gap:10px;flex-wrap:wrap;min-height:118px;}

  .card{
    width:104px;min-height:118px;border-radius:6px;padding:7px;position:relative;
    background:var(--panel);border:1px solid var(--line);cursor:default;font-size:.72rem;
    display:flex;flex-direction:column;gap:3px;
  }
  .card.playable{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,161,90,.4);}
  .card.selected{outline:2px solid var(--gold-bright);}
  .card .cname{font-family:var(--font-display);font-size:.78rem;line-height:1.1;color:var(--ink);}
  .card .ctype{font-size:.62rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.06em;}
  .card .ctext{font-size:.63rem;color:var(--ink-dim);line-height:1.25;flex:1;}
  .card .cstats{display:flex;justify-content:space-between;font-size:.75rem;margin-top:auto;}
  .card .pow{color:#d98787;} .card .hp{color:#89b98f;}
  .card .cost{position:absolute;top:5px;right:6px;background:#241a0c;color:var(--gold-bright);
    border:1px solid var(--gold);border-radius:50%;width:20px;height:20px;font-size:.7rem;
    display:flex;align-items:center;justify-content:center;}
  .card.tapped{opacity:.5;}
  .card.dmg{box-shadow:0 0 0 1px var(--danger);}
  .card-mini{width:66px;height:92px;border-radius:5px;background:linear-gradient(160deg,#2a2036,#1a1424);border:1px solid var(--line);}

  .hand{display:flex;gap:10px;overflow-x:auto;padding:10px 4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center;}
  .ability-btn{font-size:.6rem;margin-top:4px;background:#2a2036;border:1px solid var(--gold);color:var(--gold-bright);border-radius:3px;padding:2px 4px;cursor:pointer;}
  .ability-btn:disabled{opacity:.3;cursor:not-allowed;}

  .log{background:#0d0a12;border:1px solid var(--line);border-radius:6px;padding:8px 12px;max-height:130px;overflow-y:auto;font-size:.78rem;color:var(--ink-dim);margin-top:10px;}
  .log div{padding:2px 0;border-bottom:1px dashed #241d30;}
  .log div:last-child{border-bottom:none;color:var(--ink);}

  .libacao{display:flex;align-items:center;gap:6px;}
  .drop{width:11px;height:14px;background:var(--gold);clip-path:polygon(50% 0%,90% 60%,50% 100%,10% 60%);opacity:.25;}
  .drop.full{opacity:1;}

  .banner{position:fixed;inset:0;background:rgba(10,7,15,.92);display:flex;align-items:center;justify-content:center;z-index:50;text-align:center;}
  .banner h1{font-size:2.6rem;color:var(--gold-bright);}
  .modal-back{position:fixed;inset:0;background:rgba(10,7,15,.75);display:flex;align-items:center;justify-content:center;z-index:40;}
  .modal{background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:22px;max-width:420px;width:90%;}
  .modal h3{color:var(--gold-bright);margin-top:0;}
  .modal .opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  @media (max-width:640px){
    .card{width:88px;min-height:104px;}
    .lifebar{width:70px;}
  }
</style>
</head>

// ---------- ESTADO ----------
let state = null;
let uid = 1;
const newUid = ()=> 'c'+(uid++);

function buildDeck(mytho){
  const pool = DECKS[mytho].cards;
  let deck = [];
  pool.forEach(c=>{
    for(let i=0;i<c.qty;i++){
      deck.push(Object.assign({}, c, {uid:newUid()}));
    }
  });
  return shuffle(deck);
}
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function makePlayer(name, mytho){
  const deck = buildDeck(mytho);
  const hand = deck.splice(0,5);
  return {
    name, mytho, life:20,
    libMax:0, libCur:0,
    deck, hand, field:[], graveyard:[],
    stats:{ hadesSouls:0, troopsLost:0, damagedTurns:new Set(), tengoUsed:false }
  };
}

function startGame(m1, m2){
  if(m1===m2){ alertGuardMsg('Escolha duas mitologias diferentes para os dois jogadores.'); return; }
  state = {
    players:[ makePlayer('Jogador 1', m1), makePlayer('Jogador 2', m2) ],
    turn:1, current:0, phase:'draw',
    log:[], pendingAttacker:null, showHandoff:true,
    consumedThisTurn:false,
    guided: !!setupSel.guided,
    coach: { shown: new Set() },
  };
  log(`Partida iniciada. ${DECKS[m1].name} vs ${DECKS[m2].name}.`);
  beginTurn(false);
  render();
}

function alertGuardMsg(msg){
  // usado antes de 'state' existir (na tela de configuração)
  window._guardMsg = msg;
  render();
  setTimeout(()=>{ window._guardMsg = null; render(); }, 2200);
}

function cur(){ return state.players[state.current]; }
function opp(){ return state.players[1-state.current]; }

function log(msg){ state.log.push(msg); if(state.log.length>60) state.log.shift(); }

// ---------- FASES ----------
function beginTurn(draw=true){
  const p = cur();
  p.libCur = p.libMax; // renova capacidade
  state.phase='draw';
  state.consumedThisTurn=false;
  if(draw){
    if(p.deck.length===0){ endGame(1-state.current, 'baralho esgotado'); return; }
    const c = p.deck.shift();
    p.hand.push(c);
    log(`${p.name} compra uma carta.`);
  }
  // limpa efeitos temporários das próprias tropas no início do turno
  p.field.forEach(t=>{ t.shielded=false; t.baldurUsedThisTurn=false; t.cannotBlockNext=false; t.abilitySuppressed=false; });
  p.stats.bastetUsedThisTurn=false;

  // revive Osíris se estiver pendente
  if(p.stats.osirisPending){
    const revived = p.stats.osirisPending;
    revived.hp = revived.maxHp;
    revived.tapped = true;
    p.field.push(revived);
    p.stats.osirisPending = null;
    log('Osíris ressurge das areias, restaurado pela metade da Vida.');
  }

  // passivas de início de turno
  p.field.forEach(t=>{
    if(t.id==='e_ra'){
      p.field.forEach(tt=>{ if(tt!==t){ tt.hp = Math.min(tt.maxHp, tt.hp+2); } });
      log('Rá cura 2 de Vida das tropas aliadas.');
    }
    if(t.id==='j_ryujin'){
      p.life = Math.min(20, p.life+2);
      log('Ryujin cura 2 PV (Senhor dos Mares).');
    }
  });
  state.phase='consumo';
}

function nextPhase(){
  const order=['consumo','main','battle','end'];
  const idx = order.indexOf(state.phase);
  if(state.phase==='draw'){ state.phase='consumo'; }
  else if(idx<order.length-1){ state.phase = order[idx+1]; }
  else { endTurn(); return; }
  render();
}

function endTurn(){
  state.current = 1-state.current;
  state.turn++;
  cur().field.forEach(t=>{
    if(t.cannotAttackNext){ t.cannotAttackNext=false; t.tapped=true; }
    else t.tapped=false;
  });
  state.showHandoff = true;
  beginTurn(true);
  render();
}

// ---------- AÇÕES ----------
function playConsumo(cardUid){
  const p = cur();
  if(state.consumedThisTurn) return;
  const idx = p.hand.findIndex(c=>c.uid===cardUid);
  if(idx<0) return;
  const c = p.hand[idx];
  if(c.type!=='consumo') return;
  p.hand.splice(idx,1);
  p.libMax += c.value;
  p.libCur += c.value;
  p.graveyard.push(c);
  state.consumedThisTurn = true;
  log(`${p.name} bebe ${c.name} (+${c.value} de Libação).`);
  render();
}

function tributeComum(cardUid){
  const p = cur();
  if(state.consumedThisTurn) return;
  const idx = p.hand.findIndex(c=>c.uid===cardUid);
  if(idx<0) return;
  const c = p.hand[idx];
  if(c.type!=='comum') return;
  p.hand.splice(idx,1);
  p.libMax += 1;
  p.libCur += 1;
  p.graveyard.push(c);
  state.consumedThisTurn = true;
  log(`${p.name} sacrifica ${c.name} como consumo (+1 de Libação).`);
  render();
}

function initHp(c){
  if(c.hp!=null && c.maxHp==null) c.maxHp=c.hp;
  return c;
}

function summonTroop(cardUid){
  const p = cur();
  const idx = p.hand.findIndex(c=>c.uid===cardUid);
  if(idx<0) return;
  const c = p.hand[idx];
  if(!['comum','especial','deus','ultimate'].includes(c.type)) return;
  if(c.type==='ultimate'){
    if(!checkCondition(c, p)){ alertMsg('Condição da Ultimate ainda não foi cumprida.'); return; }
  }
  if(p.libCur < c.cost){ alertMsg('Libação insuficiente.'); return; }
  p.libCur -= c.cost;
  p.hand.splice(idx,1);
  initHp(c);
  c.tapped = (c.id==='g_hermes') ? false : true; // Hermes não fica cansado (Mensageiro Veloz)
  p.field.push(c);
  log(`${p.name} invoca ${c.name}.`);
  if(c.type==='comum' && p.field.some(x=>x.id==='j_inari' && x!==c)){
    p.life = Math.min(20, p.life+1);
    log('Inari abençoa a colheita: +1 PV.');
  }
  onEnter(c,p);
  if(c.type==='ultimate') onUltimate(c,p);
  render();
}

function checkCondition(c, p){
  const s = p.stats;
  switch(c.condition){
    case 'hadesSouls>=3': return s.hadesSouls>=3;
    case 'troopsLost>=2': return s.troopsLost>=2;
    case 'graveyard>=4': return p.graveyard.length>=4;
    case 'damagedTurns>=3': return s.damagedTurns.size>=3;
    default: return true;
  }
}

function onEnter(c,p){
  const o = opp();
  if(c.id==='g_poseidon'){
    const fIdx = o.field.findIndex(x=>x.type==='comum');
    if(fIdx>=0){
      const t = o.field.splice(fIdx,1)[0];
      t.tapped=false; t.hp = t.maxHp;
      o.hand.push(t);
      log(`Poseidon devolve ${t.name} para a mão de ${o.name}.`);
    }
  }
  if(c.id==='n_freya'){
    const target = p.field.find(x=>x!==c && x.hp<x.maxHp);
    if(target){ target.hp = Math.min(target.maxHp, target.hp+3); log(`Freya cura 3 de Vida em ${target.name}.`); }
    else { p.life+=2; log(`Freya cura 2 PV de ${p.name}.`); }
  }
  // Atena, Sif e Hachiman: ao entrar, buffam as tropas comuns já em campo
  if(c.id==='g_atena'){
    p.field.forEach(t=>{ if(t.type==='comum'){ t.power+=1; } });
    log('Atena inspira as tropas comuns aliadas (+1 de poder).');
  }
  if(c.id==='n_sif'){
    p.field.forEach(t=>{ if(t.type==='comum'){ t.power+=1; t.hp+=1; t.maxHp+=1; } });
    log('Sif abençoa as tropas comuns aliadas (+1/+1).');
  }
  if(c.id==='j_hachiman'){
    p.field.forEach(t=>{ if(t.type==='comum'){ t.power+=1; } });
    log('Hachiman fortalece as tropas comuns aliadas (+1 de poder).');
  }
  // Apolo: cura quando outra tropa especial/deus aliada entra em campo
  if(c!==null && (c.type==='especial'||c.type==='deus')){
    const apolo = p.field.find(x=>x.id==='g_apolo' && x!==c);
    if(apolo){ p.life = Math.min(20, p.life+1); log('A luz de Apolo cura 1 PV.'); }
  }
  // Sekhmet: dano em área ao entrar
  if(c.id==='e_sekhmet'){
    o.field.slice().forEach(t=>{ t.hp-=1; if(t.hp<=0) destroyTroop(t,o,false); });
    log('Sekhmet ruge com fúria: 1 de dano a todas as tropas inimigas.');
  }
}

function onUltimate(c,p){
  const o = opp();
  if(c.id==='g_tifon'){
    if(o.field.length){
      const t = o.field.reduce((a,b)=> a.power>b.power?a:b);
      destroyTroop(t,o,false);
      log(`Tífon destrói ${t.name}.`);
    }
    const hades = p.field.find(x=>x.id==='g_hades');
    if(hades){ hades.power+=2; hades.hp+=2; hades.maxHp+=2; log('Hades ganha +2/+2.'); }
  }
  if(c.id==='n_ragnarok'){
    const thor = p.field.find(x=>x.id==='n_thor');
    [...p.field,...o.field].forEach(t=>{
      if(t===thor) return;
      const owner = p.field.includes(t)?p:o;
      moveToGrave(t, owner);
    });
    p.field = thor? [thor] : [];
    o.field = [];
    if(thor){ thor.power+=5; thor.hp+=5; thor.maxHp+=5; log('Thor ganha +5/+5 e sobrevive ao Ragnarok.'); }
    log('Ragnarok varre o campo de batalha.');
  }
  if(c.id==='e_juizo'){
    const diff = p.graveyard.length - o.graveyard.length;
    if(diff>0){ o.life -= diff*2; log(`Julgamento de Anúbis: ${o.name} perde ${diff*2} PV.`); }
    else if(diff<0){ p.life += diff*2; log(`Julgamento de Anúbis se volta contra ${p.name}, que perde ${-diff*2} PV.`); }
    else log('Julgamento de Anúbis: cemitérios empatados, nada acontece.');
  }
  if(c.id==='j_yata'){
    if(o.field.length){
      const t = o.field.reduce((a,b)=> a.power>b.power?a:b);
      destroyTroop(t,o,false);
      p.life = Math.min(20, p.life + t.power);
      log(`Espelho de Yata destrói ${t.name} e cura ${t.power} PV.`);
    }
  }
}

function castSpell(cardUid){
  const p = cur(); const o = opp();
  const idx = p.hand.findIndex(c=>c.uid===cardUid);
  if(idx<0) return;
  const c = p.hand[idx];
  if(c.type!=='feitico') return;
  if(p.libCur < c.cost){ alertMsg('Libação insuficiente.'); return; }
  p.libCur -= c.cost;
  p.hand.splice(idx,1);
  p.graveyard.push(c);
  log(`${p.name} conjura ${c.name}.`);
  resolveSpell(c,p,o);
  render();
}

function resolveSpell(c,p,o){
  switch(c.id){
    case 'g_furia':
      o.field.slice().forEach(t=>{ t.hp-=2; if(t.hp<=0) destroyTroop(t,o,true); });
      log('Fúria do Olimpo causa 2 de dano às tropas inimigas.');
      break;
    case 'g_estige': {
      if(p.graveyard.length){
        const revIdx = p.graveyard.findIndex(x=>['comum','especial','deus'].includes(x.type));
        if(revIdx>=0){ const t=p.graveyard.splice(revIdx,1)[0]; delete t.tapped; t.hp=t.maxHp; p.hand.push(t); log(`${t.name} retorna à mão.`);}
      }
      break; }
    case 'n_furiab': {
      const t = p.field[p.field.length-1];
      if(t){ t.power+=3; log(`${t.name} ganha +3 de poder neste turno.`); }
      break; }
    case 'n_muralha':
      p.field.forEach(t=> t.hp+=2);
      log('Todas as tropas aliadas ganham +0/+2.');
      break;
    case 'e_areias': {
      const t = o.field[0];
      if(t){ o.field.shift(); delete t.tapped; t.hp=t.maxHp; o.deck.unshift(t); log(`${t.name} volta ao topo do baralho de ${o.name}.`); }
      break; }
    case 'e_bencao':
      p.libMax+=2; p.libCur+=2;
      log('Bênção do Nilo concede +2 de Libação.');
      break;
    case 'j_bushido': {
      const t = p.field[p.field.length-1];
      if(t){ t.shielded = true; log(`${t.name} está protegido neste turno (Bushido).`); }
      break; }
    case 'j_nevoa':
      o.stats.abilityLocked = true;
      log(`Ilusão de Névoa anula a próxima habilidade ativada de ${o.name}.`);
      break;
    case 'g_nectar':
      p.life = Math.min(20, p.life+4);
      log('Néctar dos Deuses cura 4 PV.');
      break;
    case 'n_corvos':
      if(p.deck.length){ p.hand.push(p.deck.shift()); log('Chamado dos Corvos: +1 carta.'); }
      break;
    case 'e_papiro':
      if(p.deck.length){ p.hand.push(p.deck.shift()); log('Papiro Sagrado: +1 carta.'); }
      break;
    case 'j_vento': {
      const target = o.field.find(x=>x.type==='comum');
      if(target){ destroyTroop(target,o,true); log(`Kami no Kaze destrói ${target.name}.`); }
      break; }
  }
}

function useActive(cardUid){
  const p = cur(); const o = opp();
  const t = p.field.find(x=>x.uid===cardUid);
  if(!t || !t.active) return;
  if(t.abilitySuppressed){ alertMsg(`${t.name} está sem habilidade neste turno (Véu da Noite).`); return; }
  if(p.stats.abilityLocked){ p.stats.abilityLocked=false; alertMsg(`A Ilusão de Névoa anula a habilidade de ${t.name}!`); return; }
  if(p.libCur < t.active.cost){ alertMsg('Libação insuficiente.'); return; }
  p.libCur -= t.active.cost;
  log(`${p.name} ativa ${t.active.label} (${t.name}).`);
  resolveActive(t,p,o);
  render();
}

function resolveActive(t,p,o){
  switch(t.id){
    case 'g_nix': {
      const target = o.field.find(x=>x.active || x.text.includes('Passiva'));
      if(target){ target.abilitySuppressed=true; log(`${target.name} perde a habilidade até o fim do turno.`); }
      break; }
    case 'g_zeus': {
      const weak = o.field.find(x=>x.hp<=3);
      if(weak){ destroyTroop(weak,o,true); log(`Raio de Zeus destrói ${weak.name}.`); }
      else { o.life-=3; markDamage(o); log(`Raio de Zeus causa 3 de dano direto.`); }
      break; }
    case 'g_hades':
      log('Hades aguarda uma tropa cair em batalha para devorar a alma.');
      break;
    case 'n_loki': {
      const target = o.field.find(x=>x.type==='comum');
      if(target){ destroyTroop(target,o,true); log(`Loki engana e destrói ${target.name}.`); }
      break; }
    case 'n_odin':
      if(p.deck.length){ p.hand.push(p.deck.shift()); log('Odin concede sabedoria: +1 carta.'); }
      break;
    case 'e_khonshu':
      log('Khonshu observa o topo do baralho (revisão silenciosa).');
      break;
    case 'g_afrodite': {
      const target = o.field.reduce((a,b)=> (!a||b.power>a.power)?b:a, null);
      if(target){ target.cannotAttackNext = true; log(`Afrodite encanta ${target.name}, que não poderá atacar no próximo turno.`); }
      break; }
    case 'g_hefesto': {
      const target = p.field.reduce((a,b)=> (!a||b.power<a.power)?b:a, null);
      if(target){ target.power+=2; target.hp+=2; target.maxHp+=2; log(`Hefesto forja ${target.name} (+2/+2 permanente).`); }
      break; }
    case 'n_skadi': {
      const target = o.field.reduce((a,b)=> (!a||b.hp>a.hp)?b:a, null);
      if(target){ target.cannotBlockNext = true; log(`Skadi congela ${target.name}, que não poderá bloquear.`); }
      break; }
    case 'n_tyr': {
      const target = o.field.filter(x=>x.power<=6).reduce((a,b)=>(!a||b.power>a.power)?b:a, null);
      if(target){ destroyTroop(target,o,true); }
      moveToGrave(t,p);
      log(`Tyr se sacrifica para destruir ${target?target.name:'um inimigo'} (Sacrifício da Mão).`);
      break; }
    case 'e_isis': {
      const gIdx = p.graveyard.findIndex(x=>x.type==='comum');
      if(gIdx>=0){ const c = p.graveyard.splice(gIdx,1)[0]; c.tapped=false; c.hp=c.maxHp; p.hand.push(c); log(`Ísis traz ${c.name} de volta à mão.`); }
      break; }
    case 'e_thoth':
      if(p.deck.length){ p.hand.push(p.deck.shift()); log('Thoth registra sua sabedoria: +1 carta.'); }
      break;
    case 'j_raijin': {
      const target = o.field.reduce((a,b)=>(!a||b.power>a.power)?b:a, null);
      if(target){ target.hp-=2; log(`Trovão de Raijin atinge ${target.name}.`); if(target.hp<=0) destroyTroop(target,o,true); }
      break; }
    case 'j_fujin': {
      const target = o.field.reduce((a,b)=>(!a||(b.cost||0)>(a.cost||0))?b:a, null);
      if(target){ o.field.splice(o.field.indexOf(target),1); target.tapped=false; target.hp=target.maxHp; o.hand.push(target); log(`Fujin sopra ${target.name} de volta à mão de ${o.name}.`); }
      break; }
    case 'e_anubis': {
      const revIdx = p.graveyard.findIndex(x=>['comum','especial','deus'].includes(x.type));
      if(revIdx>=0){
        const c = p.graveyard.splice(revIdx,1)[0];
        const revived = Object.assign({}, c, {uid:newUid()});
        revived.power = Math.ceil(revived.power/2);
        revived.maxHp = Math.ceil(revived.maxHp/2);
        revived.hp = revived.maxHp;
        revived.tapped = true;
        p.field.push(revived);
        log(`Anúbis ressuscita ${revived.name} (status pela metade).`);
      }
      break; }
    case 'j_kitsune':
      p.stats.illusionReady = true;
      log('Kitsune prepara uma ilusão para o próximo ataque inimigo.');
      break;
    case 'j_izanagi': {
      const gIdx = p.graveyard.findIndex(x=>x.type==='comum');
      if(gIdx>=0){ const c = p.graveyard.splice(gIdx,1)[0]; delete c.tapped; c.hp=c.maxHp; p.hand.push(c); log(`${c.name} renasce e volta à mão.`); }
      break; }
    case 'j_susanoo':
      [...p.field,...o.field].forEach(x=>{ if(x.hp<=2) destroyTroop(x, p.field.includes(x)?p:o, true); });
      log('Tempestade de Susanoo destrói tropas frágeis.');
      break;
  }
}

function markDamage(playerObj){
  playerObj.stats.damagedTurns.add(state.turn);
}

function moveToGrave(t, owner){
  const idx = owner.field.indexOf(t);
  if(idx>=0) owner.field.splice(idx,1);
  owner.graveyard.push(t);
}

function destroyTroop(t, owner, isBattle){
  // Bastet: uma vez por turno, salva a primeira tropa aliada que seria destruída
  if(owner.field.some(x=>x.id==='e_bastet') && !owner.stats.bastetUsedThisTurn){
    owner.stats.bastetUsedThisTurn = true;
    t.hp = 1;
    log(`Bastet protege ${t.name}, que sobrevive com 1 de Vida (Nove Vidas).`);
    return;
  }
  moveToGrave(t, owner);
  owner.stats.troopsLost++;
  log(`${t.name} (${owner.name}) é destruído.`);

  // Osíris: ressuscita uma vez por partida no início do próximo turno do dono
  if(t.id==='e_osiris' && !owner.stats.osirisRevived){
    owner.stats.osirisRevived = true;
    const revived = Object.assign({}, t, {uid:newUid()});
    revived.maxHp = Math.ceil(t.maxHp/2);
    revived.hp = revived.maxHp;
    owner.stats.osirisPending = revived;
    log('Osíris começa a se reformar nas areias do tempo...');
  }

  // Valquíria: ganha +1/+1 quando uma tropa aliada morre em batalha
  if(isBattle){
    const valk = owner.field.find(x=>x.id==='n_valquiria' && x!==t);
    if(valk){ valk.power+=1; valk.hp+=1; valk.maxHp+=1; log('A Valquíria colhe a alma caída (+1/+1).'); }
  }

  // Oni: ao ser destruído, causa 1 de dano ao oponente
  if(t.id==='j_oni'){
    const enemy = state.players[1-state.players.indexOf(owner)];
    enemy.life -=1; markDamage(enemy);
    log('O Oni explode em fúria: 1 de dano ao oponente!');
  }

  const hadesOwner = state.players.find(pl=> pl.field.some(x=>x.id==='g_hades'));
  if(isBattle && hadesOwner){
    const hades = hadesOwner.field.find(x=>x.id==='g_hades');
    if(hades && hadesOwner.libCur>=1){
      hadesOwner.libCur-=1;
      hades.power+=1; hades.hp+=1; hades.maxHp+=1;
      hadesOwner.stats.hadesSouls++;
      log(`Hades devora a alma de ${t.name}! (+1/+1, almas: ${hadesOwner.stats.hadesSouls})`);
    }
  }
  const izanami = state.players.find(pl=> pl===owner && pl.field.some(x=>x.id==='j_izanami'));
  if(izanami){
    const other = state.players[1-state.players.indexOf(owner)];
    other.life -=1; markDamage(other);
    log('Izanami inflige 1 de dano ao oponente pela fúria do submundo.');
  }
}

// ---------- COMBATE ----------
function declareAttacker(cardUid){
  const p = cur();
  const t = p.field.find(x=>x.uid===cardUid);
  if(!t || t.tapped) return;
  state.pendingAttacker = cardUid;
  render();
}

function chooseBlocker(defUid){
  const attackerUid = state.pendingAttacker;
  if(!attackerUid) return;
  const p = cur(); const o = opp();
  const att = p.field.find(x=>x.uid===attackerUid);
  if(!att) return;
  att.tapped = true;
  let def = defUid ? o.field.find(x=>x.uid===defUid) : null;

  if(def && !def.flying && att.flying){
    alertMsg(`${att.name} voa — só pode ser bloqueado por tropas voadoras.`);
    def = null;
  }
  if(def && def.cannotBlockNext){
    alertMsg(`${def.name} está congelado e não pode bloquear.`);
    def = null;
  }
  if(def && def.type==='comum' && att.id==='n_fenrir'){
    alertMsg('Fenrir não pode ser bloqueado por tropas comuns.');
    def = null;
  }

  let attPower = att.power;
  if(att.id==='g_ares') attPower += 2; // fúria de batalha

  if(def){
    let dmgToDef = attPower;
    let dmgToAtt = def.power;
    if(att.id==='g_artemis' && def.type==='comum') dmgToDef *= 2; // flecha da caçadora
    if(o.field.some(x=>x.id==='n_thor')){ dmgToDef = Math.max(1, dmgToDef-1); }
    if(def.id==='n_baldur' && !def.baldurUsedThisTurn){ dmgToDef = 0; def.baldurUsedThisTurn = true; log('Baldur ignora o dano de batalha!'); }
    if(def.id==='j_tsukuyomi'){ dmgToDef = Math.max(0, dmgToDef-1); }
    if(def.shielded){ dmgToDef = 0; }

    const defWillDie = (def.hp - dmgToDef) <= 0 && !def.shielded;
    if(att.id==='e_sobek' && defWillDie) dmgToAtt = 0; // mordida do nilo: sem retaliação

    def.hp -= dmgToDef;
    att.hp -= dmgToAtt;
    log(`${att.name} ataca ${def.name}: ${dmgToDef} de dano ao defensor, ${dmgToAtt} de dano ao atacante.`);

    let attDied=false, defDied=false;
    if(def.hp<=0 && !def.shielded){ destroyTroop(def,o,true); defDied=true; }
    if(att.hp<=0 && !att.shielded){ destroyTroop(att,p,true); attDied=true; }

    // Héracles: vence o combate e sai fortalecido
    if(defDied && !attDied && att.id==='g_heracles'){ att.power+=1; att.hp+=1; att.maxHp+=1; log('Héracles conclui mais um trabalho (+1/+1).'); }
    if(attDied && !defDied && def.id==='g_heracles'){ def.power+=1; def.hp+=1; def.maxHp+=1; log('Héracles conclui mais um trabalho (+1/+1).'); }

    if(!attDied){
      const amaterasu = p.field.find(x=>x.id==='j_amaterasu');
      if(amaterasu){ p.life = Math.min(20,p.life+1); log('Amaterasu cura 1 PV (tropa sobreviveu).'); }
    }
  } else {
    if(o.field.some(x=>x.id==='n_heimdall')) attPower = Math.max(0, attPower-1);
    o.life -= attPower;
    markDamage(o);
    log(`${att.name} ataca diretamente: ${attPower} de dano a ${o.name}.`);
    if(o.life<=0){ endGame(state.current, `${p.name} venceu!`); }
  }
  state.pendingAttacker = null;
  render();
}

function endGame(winnerIdx, reason){
  state.phase='over';
  state.winner = winnerIdx;
  state.winReason = reason;
  render();
}

function getCoachTip(){

  for(const t of COACH_TIPS){

  }
  return null;
}
function dismissCoachTip(id){
  state.coach.shown.add(id);
  render();
}
function renderCoachBanner(){
  const tip = getCoachTip();
  if(!tip) return '';
  return `<div class="coach-banner">

    <button class="secondary" onclick="dismissCoachTip('${tip.id}')">Entendi</button>

function alertMsg(msg){

const app = document.getElementById('app');

function render(){
  if(!state){ renderSetup(); }
  else if(state.phase==='over'){ renderGameOver(); }
  else if(state.showHandoff){ renderHandoff(); }
  else { renderGame(); }
  if(tutorialOpen){ app.insertAdjacentHTML('beforeend', renderTutorialModal()); }
}

let setupSel = {p1:null, p2:null, guided:false};
function renderSetup(){

      const click = taken ? '' : `onclick="selectDeck('${playerKey}','${k}')"`;
      return `<div class="${cls}" ${click}>
        <span class="swatch ${k}"></span> ${d.name} <span style="color:var(--ink-dim);font-size:.78rem;">(${d.drinkName})</span>
        ${taken ? '<span style="margin-left:auto;font-size:.68rem;color:var(--ink-dim);">em uso</span>' : ''}
      </div>`;
    }).join('');
  };
  app.innerHTML = `
    <div class="setup">
      <h1>Embate Divino</h1>
      <p class="sub">Um jogo de cartas entre panteões. Escolha um baralho diferente para cada jogador — a partida é jogada no mesmo dispositivo (hotseat).</p>

      <div class="picker-row">

      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="primary" ${(!setupSel.p1||!setupSel.p2)?'disabled':''} onclick="startGame(setupSel.p1, setupSel.p2)">Começar a Partida</button>

function selectDeck(who, key){
  const other = who==='p1' ? 'p2' : 'p1';
  if(setupSel[other]===key) return; // já está em uso pelo outro jogador
  setupSel[who]=key;
  render();
}
function randomizeDecks(){
  const keys = Object.keys(DECKS);
  const k1 = keys[Math.floor(Math.random()*keys.length)];
  let k2;
  do{ k2 = keys[Math.floor(Math.random()*keys.length)]; } while(k2===k1);
  setupSel.p1 = k1; setupSel.p2 = k2;
  render();
}

function cardHtml(c, opts={}){
  const isTroop = ['comum','especial','deus','ultimate'].includes(c.type);
  const cls = ['card'];
  if(opts.playable) cls.push('playable');
  if(opts.selected) cls.push('selected');
  if(c.tapped) cls.push('tapped');
  if(c.hp!=null && c.maxHp!=null && c.hp<c.maxHp) cls.push('dmg');
  const costBadge = c.cost!=null ? `<div class="cost">${c.cost}</div>` : '';
  const statsHtml = isTroop ? `<div class="cstats"><span class="pow">⚔ ${c.power}</span><span class="hp">♥ ${c.hp}</span></div>` : '';
  const typeLabel = {consumo:'Consumo',comum:'Tropa Comum',especial:'Tropa Especial',deus:'Deus',feitico:'Feitiço',ultimate:'Ultimate'}[c.type];
  return `<div class="${cls.join(' ')}" data-uid="${c.uid}" onclick="${opts.onClick||''}">
      ${costBadge}
      <div class="cname">${c.name}</div>
      <div class="ctype">${typeLabel}</div>
      <div class="ctext">${c.text||''}</div>
      ${statsHtml}
      ${opts.activeBtn||''}
    </div>`;
}

    if(canBlock && attackerCard && attackerCard.id==='n_fenrir' && t.type==='comum') canBlock=false;
    return cardHtml(t, { onClick: canBlock ? `chooseBlocker('${t.uid}')` : '', playable: canBlock });

    const playable = !!onClick;
    return cardHtml(c, {onClick, playable});
  }).join('');

  const phaseNames = {draw:'Compra', consumo:'Consumo', main:'Principal', battle:'Batalha', end:'Fim'};

  app.innerHTML = `
    <div class="topbar">
      <div class="title">Embate Divino — Turno ${state.turn}</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="phase-pill">Fase: ${phaseNames[state.phase]}</div>
        <button class="secondary" style="padding:4px 10px;border-radius:50%;" onclick="openTutorial()" title="Como jogar">?</button>

    <div class="player-strip opp">

      <div style="display:flex;align-items:center;">
        <div class="stat">PV <b>${o.life}</b><span class="lifebar"><div style="width:${Math.max(0,o.life)*5}%"></div></span></div>
        <div class="stat">Mão <b>${o.hand.length}</b></div>
        <div class="stat">Cemitério <b>${o.graveyard.length}</b></div>
        <div class="stat libacao">Libação ${dropIcons(o.libCur, Math.max(o.libMax,1))}</div>
      </div>
    </div>
    <div class="field">
      <div class="field-label">Campo de ${o.name} ${state.pendingAttacker?'— escolha um alvo para bloquear ou clique fora para atacar direto':''}</div>
      <div class="field-row">${oppFieldHtml}</div>
      ${state.pendingAttacker ? `<div style="margin-top:8px;"><button class="secondary" onclick="chooseBlocker(null)">Não bloquear — atacar ${o.name} diretamente</button></div>` : ''}
    </div>

    <div class="field">
      <div class="field-label">Seu Campo (${p.name})</div>
      <div class="field-row">${myFieldHtml}</div>
    </div>

    <div class="player-strip">
      <div class="pname">${p.name} — ${DECKS[p.mytho].name}</div>
      <div style="display:flex;align-items:center;">
        <div class="stat">PV <b>${p.life}</b><span class="lifebar"><div style="width:${Math.max(0,p.life)*5}%"></div></span></div>
        <div class="stat">Baralho <b>${p.deck.length}</b></div>
        <div class="stat">Cemitério <b>${p.graveyard.length}</b></div>
        <div class="stat libacao">Libação ${dropIcons(p.libCur, Math.max(p.libMax,1))} <b>${p.libCur}/${p.libMax}</b></div>
      </div>
    </div>

    <div class="field-label">Sua Mão</div>
    <div class="hand">${handHtml}</div>

    <div class="btn-row">
      ${state.phase==='consumo' ? `<span style="color:var(--ink-dim);font-size:.85rem;">Jogue 1 carta de bebida ou sacrifique 1 tropa comum (opcional).</span>`:''}
      <button class="secondary" onclick="nextPhase()">Avançar Fase →</button>
    </div>

    ${state.notice ? `<div class="modal-back"><div class="modal"><p>${state.notice}</p></div></div>` : ''}

    <div class="log">${state.log.slice().reverse().map(l=>`<div>${l}</div>`).join('')}</div>
  `;
}

render();
</script>
</body>
</html>
